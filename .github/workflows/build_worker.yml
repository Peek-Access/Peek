name: build-worker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/worker/**"
      - ".github/workflows/build_worker.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/worker/Peek.Worker/Peek.Worker.csproj

      - name: Build
        run: dotnet build src/worker/Peek.Worker/Peek.Worker.csproj -c Release --no-restore
