<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Bold, solid-fill eye glyph - deliberately no thin outlines, scanline texture, or
       small highlight dots: those all but disappear once downscaled to a 16x16/32x32
       taskbar or title-bar icon. Two solid shapes (lens + pupil) stay legible at every
       size Windows actually renders an app icon at. The lens is sized to fill most of
       the canvas (not a small centered glyph) so it still reads clearly at 16x16 instead
       of shrinking into an indistinct blob surrounded by flat background. The background
       gradient and glow behind the lens are subtle enough to disappear at tiny sizes but
       give the icon depth at 48px and up, matching peek_logo_showcase.svg.
  -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#0f3d22"/>
      <stop offset="100%" stop-color="#081C10"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="292" height="292" rx="65" fill="url(#bgGlow)"/>

  <ellipse cx="150" cy="150" rx="140" ry="85" fill="#27FF72" opacity="0.18" filter="url(#soft)"/>

  <path d="M 20,150
           C 20,101 82,83 150,83
           C 218,83 280,101 280,150
           C 280,199 218,217 150,217
           C 82,217 20,199 20,150 Z"
        fill="#27FF72"/>
  <circle cx="150" cy="150" r="50" fill="#081C10"/>
</svg>
