<!-- Large-format showcase logo (About window, README banner) - same bold eye glyph as
     peek_icon.svg, with the glow/branding text that only reads well at this size. The
     small functional icons (.ico for the taskbar/title bar/installer) intentionally drop
     all of this - see peek_icon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#0f3d22"/>
      <stop offset="100%" stop-color="#081C10"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="112" ry="112" fill="url(#glow)"/>

  <!-- soft glow behind the eye -->
  <ellipse cx="256" cy="248" rx="230" ry="140" fill="#27FF72" opacity="0.18" filter="url(#soft)"/>

  <path d="M 66,248
           C 66,170 152,150 256,150
           C 360,150 446,170 446,248
           C 446,326 360,346 256,346
           C 152,346 66,326 66,248 Z"
        fill="#27FF72"/>
  <circle cx="256" cy="248" r="72" fill="#081C10"/>

  <text x="256" y="452" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace" font-size="56" letter-spacing="18"
        fill="#27FF72">PEEK</text>
</svg>
